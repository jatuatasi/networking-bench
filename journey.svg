<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One ride request, start to finish</title>
  <desc>The ride request travels from the phone and home router, across internet routers, into RideNow's firewall, load balancer, reverse proxy, app server and private database.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6b68" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="430" rx="14" fill="#f7faf9"/>
  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#15211f">One ride request, start to finish</text>

  <rect x="20" y="50" width="180" height="330" rx="12" fill="none" stroke="#9fb0ad" stroke-dasharray="5 5"/>
  <rect x="215" y="50" width="130" height="330" rx="12" fill="none" stroke="#9fb0ad" stroke-dasharray="5 5"/>
  <rect x="360" y="50" width="340" height="330" rx="12" fill="none" stroke="#9fb0ad" stroke-dasharray="5 5"/>
  <text x="110" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#15211f">Passenger's home</text>
  <text x="280" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#15211f">Internet</text>
  <text x="530" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#15211f">RideNow</text>

  <g stroke="#5b6b68" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="110" y1="160" x2="110" y2="276"/>
    <line x1="185" y1="312" x2="226" y2="290"/>
    <line x1="280" y1="258" x2="280" y2="228"/>
    <line x1="280" y1="178" x2="280" y2="148"/>
    <line x1="330" y1="120" x2="376" y2="112"/>
    <line x1="530" y1="140" x2="530" y2="156"/>
    <line x1="530" y1="206" x2="530" y2="222"/>
    <line x1="452" y1="272" x2="452" y2="296"/>
    <line x1="525" y1="330" x2="538" y2="330"/>
  </g>

  <g font-size="11.5" text-anchor="middle">
    <rect x="35" y="96" width="150" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="110" y="121" font-size="14" font-weight="700" fill="#3C3489">Phone</text>
    <text x="110" y="142" fill="#534AB7">Private IP · DHCP</text>

    <rect x="35" y="280" width="150" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="110" y="305" font-size="14" font-weight="700" fill="#3C3489">Home router</text>
    <text x="110" y="326" fill="#534AB7">ARP · NAT · public IP</text>

    <rect x="230" y="100" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="280" y="127" font-size="14" font-weight="700" fill="#444441">Router</text>
    <rect x="230" y="180" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="280" y="207" font-size="14" font-weight="700" fill="#444441">Router</text>
    <rect x="230" y="260" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="280" y="287" font-size="14" font-weight="700" fill="#444441">Router</text>
    <rect x="230" y="322" width="100" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="280" y="347" font-size="13" font-weight="700" fill="#444441">DNS server</text>

    <rect x="380" y="90" width="300" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="530" y="110" font-size="14" font-weight="700" fill="#085041">Firewall</text>
    <text x="530" y="127" fill="#0F6E56">Only allowed traffic gets in</text>

    <rect x="380" y="158" width="300" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="530" y="178" font-size="14" font-weight="700" fill="#085041">Load balancer</text>
    <text x="530" y="195" fill="#0F6E56">Picks a healthy server</text>

    <rect x="380" y="224" width="300" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="530" y="244" font-size="14" font-weight="700" fill="#085041">Reverse proxy</text>
    <text x="530" y="261" fill="#0F6E56">TLS termination · routing · caching</text>

    <rect x="380" y="298" width="145" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="452" y="323" font-size="14" font-weight="700" fill="#085041">App server</text>
    <text x="452" y="344" fill="#0F6E56">HTTP · WebSocket</text>

    <rect x="540" y="298" width="140" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="610" y="323" font-size="14" font-weight="700" fill="#085041">Database</text>
    <text x="610" y="344" fill="#0F6E56">Private subnet</text>
  </g>

  <text x="360" y="406" text-anchor="middle" font-size="12" fill="#5b6b68">Along the way: TCP handshake and TLS secure the connection · UDP for live calls · OSI model to troubleshoot</text>
</svg>
